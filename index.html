<!DOCTYPE html>
<html lang="en">

<head>
    <title>Button vs. Button</title>

    <style>

    </style>
</head>

<body>
    <h1>Button vs. Button</h1>
    <p id="uidDisplay">Your Player ID is XXXX-XXXX.</p>
    <p id="teamClicks">Team 1 has clicked the button X times. Team 2 has clicked the button X times.</p>
    <p id="instructions">Select your team:</p>
    <p id="myClicks" style="display: none;">You have clicked the button 0 times.</p>
    <button id="team1btn">Team 1</button>
    <button id="team2btn">Team 2</button>
    <button id="clicker" style="display: none;">Click</button>
</body>

<script>
    const uidDisplay = document.getElementById("uidDisplay");
    const instructions = document.getElementById("instructions");
    const myClicks = document.getElementById("myClicks");
    const teamClicks = document.getElementById("teamClicks");
    const team1btn = document.getElementById("team1btn");
    const team2btn = document.getElementById("team2btn");
    const clicker = document.getElementById("clicker");

    let userId = 0;
    let userTeam = 0;
    let userClicks = 0;

    let team1 = 0;
    let clicks2 = 0;

    function screen2() {
        instructions.style.display = "none";
        team1btn.style.display = "none";
        team2btn.style.display = "none";
        clicker.style.display = "block";
        myClicks.style.display = "block";
    }

    team1btn.addEventListener("click", function () {
        userTeam = 1;
        screen2();
    });

    team2btn.addEventListener("click", function () {
        userTeam = 2;
        screen2();
    });

    clicker.addEventListener("click", async function () {
        if (userTeam != 0) {
            const response = await fetch("/click", {
                method: "POST",
                body: JSON.stringify({ "team": userTeam, "id": userId }),
                headers: { "Content-Type": "application/json" }
            });

            success = (await response.text() === "true");

            if (success) {
                userClicks++;
                myClicks.innerText = `You have clicked the button ${userClicks} time${(userClicks == 1 ? "" : "s")}.`;
            } else {
                alert("An error occured. Your User ID may be invalid.");
                window.location.reload();
            }
        }
    });

    // These functions are from one of my old projects
    function setCookie(name, value, days) {
        const d = new Date();
        d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
        const expires = "expires=" + d.toUTCString();
        document.cookie = name + "=" + value + ";" + expires + ";path=/";
    }

    function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }

    async function joinGame() {
        const response = await fetch("/join");
        userId = await response.text();
        setCookie("uid", userId, "1");
        setTimeout(() => {
            alert("Your User ID has expired! Refresh the page to get a new one.");
            setCookie("uid", null, "0");
            window.location.reload();
        }, 590000);
        return userId;
    }

    window.onload = async function () {

        let savedId = getCookie("uid");

        if (savedId == null) {
            await joinGame();
        } else {
            const response = await fetch("/validate", {
                method: "POST",
                body: JSON.stringify({ "id": savedId }),
                headers: { "Content-Type": "application/json" }
            });
            let valid = (await response.text() === "true");
            if (!valid) {
                await joinGame();
            } else {
                userId = savedId;
            }
        }

        uidDisplay.innerText = `Your Player ID is ${userId}.`;
    };

    async function updateCounts() {
        const response = await fetch("/count");
        countJSON = await response.json();

        team1 = countJSON.team1;
        team2 = countJSON.team2;

        teamClicks.innerText = `Team 1 has clicked the button ${team1} times. Team 2 has clicked the button ${team2} times.`;
    }

    setTimeout(() => {
        updateCounts();
        setInterval(updateCounts, 1000);
    }, 100);

</script>

</html>
